services:
  postgres:
    image: postgres:18
    container_name: insurance-postgres
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker}
    environment:
      POSTGRES_DB: insurance_claims_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped

  rabbitmq:
    container_name: insurance-rabbitmq
    image: rabbitmq:4-management
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  insurance-app:
    build:
      context: .
    image: insurance-claims-workflow
    container_name: insurance-claims-app
    ports:
      - "5001:5000"
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  event-consumer:
    build:
      context: .
    image: insurance-claims-workflow
    container_name: insurance-event-consumer
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker}
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python event_consumer.py
    restart: unless-stopped

  outbox-publisher:
    build:
      context: .
    image: insurance-outbox-publisher
    container_name: insurance-outbox-publisher
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: python outbox_publisher.py
    restart: unless-stopped
    
  sla-worker:
    build:
      context: .
    image: insurance-sla-worker
    container_name: insurance-sla-worker
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.docker}
    depends_on:
      postgres:
        condition: service_started
    command: python sla_worker.py
    restart: unless-stopped

volumes:
  postgres_data: