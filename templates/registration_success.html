<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful | Insurance Claims</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef4f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-card {
            background-color: white;
            width: 90%;
            max-width: 480px;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            color: #198754;
            font-size: 52px;
        }

        h1 {
            color: #183b56;
            font-size: 26px;
        }

        p {
            color: #536575;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 22px;
            background-color: #176b87;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background-color: #10536b;
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="success-icon" aria-hidden="true">&#10003;</div>

        <h1>Registration Successful!</h1>

        <p>
            Your customer account has been created successfully.
            You can now continue to the next step of your
            insurance journey.
        </p>

        <a class="button" href="/register">Back to Registration</a>
    </div>
</body>
</html>
