
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Insurance Claims</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #eef4fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        .login-title {
            color: #174a7e;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h2 class="login-title text-center mb-2">Staff Login</h2>
        <p class="text-secondary text-center mb-4">
            Insurance Claims Processing System
        </p>

        {% if error_message %}
            <div class="alert alert-danger" role="alert">
                {{ error_message }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('staff_login_page') }}">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Sign In
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login_page') }}">
                Customer Login
            </a>
        </div>
    </main>
</body>
</html>
